name: Quality checks

# Runs the same build and checks as the deploy, without deploying,
# on every branch other than main and on pull requests.
on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PATH_PREFIX: /
      - run: npm run qa
