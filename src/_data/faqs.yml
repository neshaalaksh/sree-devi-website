# "show_on" decides where a question appears: home, fertility, faq (FAQ page).
items:
  - question: When is the OPD open?
    answer: The OPD is open Monday to Saturday. The OPD is closed on Sundays and holidays. Emergency and delivery care is available 24 hours, 7 days.
    show_on: [home, faq]
  - question: Do I need an appointment?
    answer: You can call the hospital or walk in on OPD days. Calling ahead helps reception tell you which doctor to see and when they are available.
    show_on: [home, faq]
  - question: Is emergency care available at night and on Sundays?
    answer: Yes. Emergency and delivery care is available 24 hours a day, 7 days a week. Please note that the hospital does not run an ambulance service.
    show_on: [home, faq]
  - question: Do you accept health insurance?
    answer: All health insurance is accepted, with a cashless facility. The CM Health Insurance Scheme is not accepted. Please speak with reception about your policy before admission.
    show_on: [home, faq]
  - question: What payment methods are accepted?
    answer: Cash, UPI and cards are all accepted.
    show_on: [faq]
  - question: Is parking available?
    answer: Yes, parking is available at the hospital.
    show_on: [faq]
  - question: Is food provided for patients?
    answer: Homemade food is provided for admitted patients. Food is not provided for attenders.
    show_on: [faq]
  - question: Do you offer online or video consultations?
    answer: Not at the moment. Please visit the hospital on an OPD day for a consultation.
    show_on: [faq]
  - question: Are consultation fees listed on the website?
    answer: No. Costs depend on the doctor and the care you need, so please ask reception for details specific to you.
    show_on: [faq]
  - question: How do I contact the Fertility Centre?
    answer: Call the hospital or send a WhatsApp message to the hospital number. Reception will guide you to the right doctor and the next available consultation.
    show_on: [fertility, faq]
  - question: How do I prepare for my first fertility consultation?
    answer: Bring any previous reports, scan results and prescriptions, and a list of medicines you take. If you have had fertility treatment before, bring those records too.
    show_on: [fertility, faq]
  - question: What fertility treatments are available?
    answer: The Fertility Centre offers infertility evaluation and counselling, ovulation induction, IUI, IVF, ICSI, male infertility and semen analysis, tubal patency tests (HSG), egg and embryo freezing, and recurrent pregnancy loss care. Your doctor will advise which options suit you.
    show_on: [fertility, faq]
  - question: What happens after my enquiry?
    answer: Reception will help you book a consultation on an OPD day. At the consultation, the doctor will discuss your history and explain any tests or next steps.
    show_on: [fertility, faq]
  - question: What is the difference between IVF and ICSI?
    answer: In IVF, eggs and sperm are placed together in the laboratory to fertilise. In ICSI, an embryologist injects one sperm into each egg. Your doctor will advise which is suitable, for example when there are concerns about sperm count or movement.
    show_on: [fertility, faq]
  - question: What does IVF treatment involve?
    answer: "IVF usually has five stages: medicines to help the ovaries produce eggs, with scans and blood tests to check the response; egg collection, usually under anaesthesia; fertilisation in the laboratory by IVF or ICSI; transfer of an embryo to the uterus; and a pregnancy test about two weeks later. Suitable extra embryos can be frozen for future use."
    show_on: [fertility, faq]
  - question: Should both partners be tested?
    answer: Yes. Fertility problems can involve either partner, so the Fertility Centre assesses both from the start. This avoids delays and helps the doctor choose the right treatment. Consultations and test results are confidential.
    show_on: [fertility, faq]
  - question: Do I need to sign a consent form for fertility treatment?
    answer: Yes. Under the Assisted Reproductive Technology (Regulation) Act, 2021, treatment needs your written informed consent. Your doctor will explain the procedure, its risks and what to expect before you decide. The Fertility Centre is registered as an ART clinic (Level II).
    show_on: [fertility, faq]
  - question: How much does fertility treatment cost?
    answer: Costs depend on the treatment plan and the medicines needed, so fees are not listed on this website. Ask for an estimate at your consultation.
    show_on: [fertility, faq]
  - question: What should I bring in an emergency?
    answer: If you can, bring previous medical reports, scan reports and discharge summaries, your current prescriptions and medicines, a government-issued ID, and your insurance card or policy details. Call the hospital on the way so the team can prepare.
    show_on: [faq]
  - question: Does the hospital have an ambulance?
    answer: The hospital does not run an ambulance service. In a medical emergency, the 108 ambulance service can be called free of charge anywhere in Tamil Nadu.
    show_on: [faq]
  - question: Can I be admitted at night?
    answer: Yes. Admissions are taken at any time, and emergency care, labour and delivery, ICU/HDU and the laboratory are available 24 hours.
    show_on: [faq]
  - question: Is physiotherapy available?
    answer: "Yes. The hospital's physiotherapist, S. Muthukumarasamy (BPT, MIAP), helps with back and neck pain, joint and muscle pain, recovery after surgery or injury, postpartum exercise and posture correction."
    show_on: [faq]
  - question: How do I contact the lab or pharmacy?
    answer: Call or WhatsApp the Lab & Pharmacy line on +91 73058 79055, or email sreedevihospitallab@gmail.com. The laboratory is open 24 hours. WhatsApp messages are for enquiries only.
    show_on: [faq]
