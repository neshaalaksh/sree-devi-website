# "show_on" decides where a question appears: home, fertility, faq (FAQ page).
items:
  - question: When is the OPD open?
    answer: The OPD is open Monday to Saturday. The OPD is closed on Sundays and holidays. Emergency and delivery care is available 24 hours, 7 days.
    show_on: [home, faq]
  - question: Do I need an appointment?
    answer: You can call the hospital or walk in on OPD days. Calling ahead helps reception tell you which doctor to see and when they are available.
    show_on: [home, faq]
  - question: Is emergency care available at night and on Sundays?
    answer: Yes. Emergency and delivery care is available 24 hours a day, 7 days a week. Please note that the hospital does not run an ambulance service.
    show_on: [home, faq]
  - question: Do you accept health insurance?
    answer: All health insurance is accepted, with a cashless facility. The CM Health Insurance Scheme is not accepted. Please speak with reception about your policy before admission.
    show_on: [home, faq]
  - question: What payment methods are accepted?
    answer: Cash, UPI and cards are all accepted.
    show_on: [faq]
  - question: Is parking available?
    answer: Yes, parking is available at the hospital.
    show_on: [faq]
  - question: Is food provided for patients?
    answer: Homemade food is provided for admitted patients. Food is not provided for attenders.
    show_on: [faq]
  - question: Do you offer online or video consultations?
    answer: Not at the moment. Please visit the hospital on an OPD day for a consultation.
    show_on: [faq]
  - question: Are consultation fees listed on the website?
    answer: No. Costs depend on the doctor and the care you need, so please ask reception for details specific to you.
    show_on: [faq]
  - question: How do I contact the Fertility Centre?
    answer: Call the hospital or send a WhatsApp message to the hospital number. Reception will guide you to the right doctor and the next available consultation.
    show_on: [fertility, faq]
  - question: How do I prepare for my first fertility consultation?
    answer: Bring any previous reports, scan results and prescriptions, and a list of medicines you take. If you have had fertility treatment before, bring those records too.
    show_on: [fertility, faq]
  - question: What fertility treatments are available?
    answer: The Fertility Centre offers infertility evaluation and counselling, ovulation induction, IUI, IVF, ICSI, male infertility and semen analysis, tubal patency tests (HSG), egg and embryo freezing, and recurrent pregnancy loss care. Your doctor will advise which options suit you.
    show_on: [fertility, faq]
  - question: What happens after my enquiry?
    answer: Reception will help you book a consultation on an OPD day. At the consultation, the doctor will discuss your history and explain any tests or next steps.
    show_on: [fertility, faq]
